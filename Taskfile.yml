version: '3'

env:
  UV_CACHE_DIR: '{{.UV_CACHE_DIR | default (printf "%s/.cache/uv" .ROOT_DIR)}}'
  npm_config_cache: '{{.ROOT_DIR}}/.cache/npm'

vars:
  PROD_COMPOSE: docker compose -f compose.prod.yaml --env-file .env.production

tasks:
  default:
    desc: Show all available project commands
    cmds:
      - task --list-all

  bootstrap:
    desc: Prepare local development configuration
    run: once
    cmds:
      - python3 scripts/bootstrap.py

  install:
    desc: Install locked Python and frontend dependencies
    deps: [bootstrap]
    cmds:
      - uv sync --locked
      - cd frontend && npm ci

  services:
    desc: Start PostgreSQL and Redis containers
    deps: [bootstrap]
    cmds:
      - docker compose up -d --wait --wait-timeout 120 postgres redis

  stop:
    desc: Stop PostgreSQL and Redis containers
    cmds:
      - docker compose down

  migrate:
    desc: Apply database migrations
    cmds:
      - uv run python backend/manage.py migrate

  backup:
    desc: Write a PostgreSQL dump to backups/
    vars:
      COMPOSE: '{{.COMPOSE | default "docker compose"}}'
    cmds:
      - mkdir -p backups
      - |
        out="backups/rescribo-$(date -u +%Y%m%dT%H%M%SZ).dump"
        {{.COMPOSE}} exec -T postgres sh -c 'pg_dump -Fc -U "$POSTGRES_USER" "$POSTGRES_DB"' > "$out" || { rm -f "$out"; exit 1; }
        echo "Wrote $out"

  restore-check:
    desc: Restore a dump into a throwaway database and read a report through the API
    cmds:
      - uv run python scripts/restore_check.py {{.CLI_ARGS}}

  bootstrap-owner:
    desc: Create or add a workspace owner interactively
    cmds:
      - uv run python backend/manage.py bootstrap_owner {{.CLI_ARGS}}

  demo-seed:
    desc: Create or reset the fictitious demo workspace and print the visitor sign-in
    cmds:
      - uv run python backend/manage.py seed_demo {{.CLI_ARGS}}

  issue-owner-recovery:
    desc: Issue a recovery link or set an owner's password
    cmds:
      - uv run python backend/manage.py issue_owner_recovery {{.CLI_ARGS}}

  api:
    desc: Start the Django development server
    cmds:
      - uv run python backend/manage.py runserver 127.0.0.1:8000

  web:
    desc: Start the Vite development server
    dir: frontend
    cmds:
      - npm run dev -- --host 127.0.0.1

  worker:
    desc: Start the Celery worker
    deps: [matcher-build]
    cmds:
      - uv run celery --workdir=backend -A config worker --loglevel=INFO --pool=solo

  scheduler:
    desc: Start the Celery scheduler
    cmds:
      - uv run celery --workdir=backend -A config beat --loglevel=INFO --schedule=../.cache/celerybeat-schedule

  check:
    desc: Run backend, frontend, and matcher quality checks
    cmds:
      - task check-backend
      - task check-frontend
      - task check-matcher

  check-backend:
    desc: Run Python, Django, and shell checks
    cmds:
      - python3 scripts/check_raw_colours.py
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run mypy
      - shellcheck scripts/*.sh
      - uv run python backend/manage.py check
      - uv run python backend/manage.py makemigrations --check --dry-run

  check-frontend:
    desc: Run frontend lint, type, and format checks
    cmds:
      - cd frontend && npm run lint
      - cd frontend && npm run typecheck
      - cd frontend && npm run format:check

  test:
    desc: Run backend, frontend, and matcher tests
    cmds:
      - task test-backend
      - task test-frontend
      - task test-matcher

  test-backend:
    desc: Run backend tests
    # Adapter tests run the real matcher binary.
    deps: [matcher-build]
    cmds:
      - uv run pytest

  test-frontend:
    desc: Run frontend tests
    cmds:
      - cd frontend && npm test

  check-matcher:
    desc: Run Rust format and lint checks on the matcher
    dir: rust/matcher
    cmds:
      - cargo fmt --check
      - cargo clippy --locked --all-targets -- -D warnings

  test-matcher:
    desc: Run matcher unit and contract tests
    dir: rust/matcher
    cmds:
      - cargo test --locked

  matcher-build:
    desc: Build the release matcher binary used by the local worker and tests
    dir: rust/matcher
    sources:
      - Cargo.toml
      - Cargo.lock
      - src/**/*.rs
      - ../../backend/matching/configs/*.json
    generates:
      - target/release/matcher
    cmds:
      - cargo build --locked --release

  build:
    desc: Build the frontend for production
    dir: frontend
    cmds:
      - npm run build

  format:
    desc: Format Python and frontend files
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .
      - cd frontend && npm run format

  schema:
    desc: Regenerate the OpenAPI and TypeScript contracts
    cmds:
      - uv run python backend/manage.py spectacular --file frontend/openapi.yaml --validate --fail-on-warn
      - cd frontend && npm run api:types

  schema-check:
    desc: Check generated API contracts
    cmds:
      - task schema-check-backend
      - task schema-check-frontend

  schema-check-backend:
    desc: Check the generated OpenAPI document
    cmds:
      - mkdir -p .cache
      - uv run python backend/manage.py spectacular --file .cache/openapi.yaml --validate --fail-on-warn
      - diff -u frontend/openapi.yaml .cache/openapi.yaml

  schema-check-frontend:
    desc: Check the generated TypeScript API types
    cmds:
      - mkdir -p .cache
      - cd frontend && npm exec openapi-typescript -- openapi.yaml -o ../.cache/schema.d.ts
      - diff -u frontend/src/api/schema.d.ts .cache/schema.d.ts

  eval:baseline:
    desc: Record the PostgreSQL text-search baseline for a batch (batch id)
    cmds:
      - uv run python scripts/eval_baseline.py {{.CLI_ARGS}}

  eval:matcher:
    desc: Score the Rust matcher against PostgreSQL order (batch ids, --config; --sweep on practice)
    deps: [matcher-build]
    cmds:
      - cd rust/matcher && cargo build --release --locked --example rank_with_config
      - uv run python scripts/eval_matcher.py {{.CLI_ARGS}}

  eval:jev:
    desc: Record the Jev baseline for batches (batch ids, --run 1|2; paid, needs --yes)
    cmds:
      - uv run python scripts/eval_jev.py {{.CLI_ARGS}}

  eval:review:
    desc: Step through a result's triaged failures and a sample of passes (result file name)
    cmds:
      - uv run python scripts/eval_review.py {{.CLI_ARGS}}

  eval:generate:
    desc: Generate a matching evaluation batch through OpenRouter
    cmds:
      - uv run python scripts/eval_generate.py {{.CLI_ARGS}}

  eval:review-model:
    desc: Spot-check a batch with a reviewer model through OpenRouter (batch id, --model)
    cmds:
      - uv run python scripts/eval_review_model.py {{.CLI_ARGS}}

  eval:label:
    desc: List evaluation batches, or spot-check one (batch id)
    cmds:
      - uv run python scripts/eval_label.py {{.CLI_ARGS}}

  browsers:
    desc: Install Chromium for browser tests
    dir: frontend
    cmds:
      - npx playwright install chromium

  e2e:
    desc: Run Playwright browser tests
    dir: frontend
    cmds:
      - npm run test:e2e

  worker-check:
    desc: Verify a running Celery worker
    cmds:
      - uv run python scripts/check_worker.py

  github-product-worker-check:
    desc: Verify durable GitHub work recovers through a restarted Celery worker
    cmds:
      - uv run python scripts/check_github_product_worker.py

  github-installation-check:
    desc: Run the opt-in live GitHub App installation feasibility check
    cmds:
      - uv run python scripts/check_github_installation.py {{.CLI_ARGS}}

  github-lifecycle-check:
    desc: Run the opt-in GitHub issue lifecycle feasibility check
    cmds:
      - uv run python scripts/check_github_issue_lifecycle.py {{.CLI_ARGS}}

  slack-tunnel:
    desc: Open a cloudflared quick tunnel to a local port (port, path)
    cmds:
      - bash scripts/slack_tunnel.sh {{.CLI_ARGS}}

  slack-channels:
    desc: List Slack workspace channel ids and bot membership
    cmds:
      - uv run python scripts/list_slack_channels.py

  app:
    desc: Build and start the full containerized app stack
    deps: [services]
    cmds:
      - docker compose --profile app build
      - docker compose --profile app run --rm backend uv run --no-sync python backend/manage.py migrate
      - docker compose --profile app up -d --wait

  app-stop:
    desc: Stop the containerized app stack
    cmds:
      - docker compose --profile app down

  prod-up:
    desc: Build, migrate, and start the production stack (docs/DEPLOYMENT.md)
    cmds:
      - '{{.PROD_COMPOSE}} build'
      - '{{.PROD_COMPOSE}} run --rm backend python backend/manage.py migrate'
      - '{{.PROD_COMPOSE}} up -d --wait'

  prod-stop:
    desc: Stop the production stack and keep its data
    cmds:
      - '{{.PROD_COMPOSE}} down'

  prod-manage:
    desc: Run a Django management command in the production stack
    interactive: true
    cmds:
      - '{{.PROD_COMPOSE}} run --rm backend python backend/manage.py {{.CLI_ARGS}}'

  prod-backup:
    desc: Write a production PostgreSQL dump to backups/
    cmds:
      - task: backup
        vars:
          COMPOSE: '{{.PROD_COMPOSE}}'
