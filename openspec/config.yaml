schema: spec-driven

context: |
  Rescribo turns team conversations into shipped work. A member tags
  Rescribo in a Slack thread or enters a request in the web app. Rescribo
  gathers the conversation, groups related requests, has a language model
  draft agent-ready GitHub issues with repository context, hands them to a
  coding agent or an engineer, and pings the conversation when the pull
  request is ready for review and again when it ships. Requests include
  customer reports, bugs, feature ideas, and internal asks. Models draft
  and suggest; a member approves every external write. Rescribo owns
  requests, problems, and follow-up. GitHub owns engineering issues and
  pull requests.

  Out of scope until a change says otherwise: channel scraping (reading
  conversations nobody tagged Rescribo in), attachments, Slack edit/delete
  sync, Slack Connect, DM capture; chat and issue-tracker connectors other
  than Slack and GitHub; customer portal, outbound customer email, billing,
  CRM identity resolution, several GitHub issues per problem,
  cross-workspace sharing, channel ACL mirroring, SSO, Enterprise Grid,
  public signup; publishing, grouping, messaging, or confirming a fix
  without member approval.

  Delivery order and issue breakdown live in GitHub issues; milestones set the order when the project uses them.
  Architecture and module ownership: docs/DEVELOPMENT.md. Decisions: docs/adr/.

rules:
  proposal:
    - Name the GitHub issue the change delivers.
  design:
    - Link an existing ADR instead of restating it. Add a new ADR for a decision that outlives the change.
  tasks:
    - Include the repository checks from AGENTS.md as the final task group.
