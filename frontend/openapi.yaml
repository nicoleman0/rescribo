  /api/workspaces/{workspace_id}/memberships/{membership_id}/role/:
    post:
      operationId: workspaces_memberships_role_create
      parameters:
      - in: path
        name: membership_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Role'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Role'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Role'
        required: true
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipOutput'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
components:
  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
        reason:
          type: string
        field_errors:
          type: object
          additionalProperties: {}
      required:
      - detail
      - reason
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - status
    InvitationAccept:
      type: object
      properties:
        token:
          type: string
        full_name:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - token
    InvitationCreate:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/InvitationCreateRoleEnum'
      required:
      - email
      - role
    InvitationCreateRoleEnum:
      enum:
      - member
      type: string
      description: '* `member` - member'
    InvitationListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      required:
      - created_at
      - email
      - expires_at
      - id
      - role
    InvitationOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        accept_url:
          type: string
          format: uri
      required:
      - accept_url
      - email
      - id
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    MembershipOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
      required:
      - email
      - full_name
      - id
      - role
    PasswordResetOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reset_url:
          type: string
          format: uri
      required:
      - id
      - reset_url
    PasswordResetRedeem:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - token
    Role:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleRoleEnum'
      required:
      - role
    RoleRoleEnum:
      enum:
      - owner
      - member
      type: string
      description: |-
        * `owner` - Owner
        * `member` - Member
    Session:
      type: object
      properties:
        user:
          type: object
          additionalProperties: {}
        memberships:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - memberships
      - user
    StatusEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    Token:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    TokenPreview:
      type: object
      properties:
        status:
          type: string
        workspace_name:
          type: string
      required:
      - status
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
