components:
  schemas:
    AccessEnum:
      enum:
      - ok
      - inaccessible
      - disconnected
      - access_lost
      - suspended
      - deleted
      type: string
      description: |-
        * `ok` - OK
        * `inaccessible` - Inaccessible
        * `disconnected` - Disconnected
        * `access_lost` - Access lost
        * `suspended` - Suspended
        * `deleted` - Deleted
    ActivityActionEnum:
      enum:
      - report.deleted
      - report.created
      - report.updated
      - report.assigned
      - report.linked
      - report.unlinked
      - report.dismissed
      - report.restored
      - problem.created
      - problem.updated
      - problem.state_changed
      - problem.fix_confirmed
      - engineering_issue.linked
      - engineering_issue.created
      - engineering_issue.unlinked
      type: string
      description: |-
        * `report.deleted` - Report deleted
        * `report.created` - Report created
        * `report.updated` - Report updated
        * `report.assigned` - Report assigned
        * `report.linked` - Report linked
        * `report.unlinked` - Report unlinked
        * `report.dismissed` - Report dismissed
        * `report.restored` - Report restored
        * `problem.created` - Problem created
        * `problem.updated` - Problem updated
        * `problem.state_changed` - Problem state changed
        * `problem.fix_confirmed` - Problem fix confirmed
        * `engineering_issue.linked` - Engineering issue linked
        * `engineering_issue.created` - Engineering issue created
        * `engineering_issue.unlinked` - Engineering issue unlinked
    AssignReport:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        assignee_id:
          type: string
          format: uuid
          nullable: true
      required:
      - assignee_id
      - expected_version
    Channel:
      type: object
      properties:
        channel_id:
          type: string
        name:
          type: string
        is_private:
          type: boolean
        verified_at:
          type: string
          format: date-time
      required:
      - channel_id
      - is_private
      - name
      - verified_at
    ChannelInput:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        channel_id:
          type: string
          maxLength: 64
          pattern: ^[CG][A-Z0-9]+$
        remove:
          type: boolean
          default: false
        consent:
          type: boolean
          default: false
      required:
      - channel_id
      - version
    ConfirmationEnum:
      enum:
      - DISCONNECT
      type: string
      description: '* `DISCONNECT` - DISCONNECT'
    Connection:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        identity:
          type: string
        external_id:
          type: string
        status:
          $ref: '#/components/schemas/ConnectionStatusEnum'
        scopes:
          type: array
          items:
            type: string
        error_code:
          type: string
        error_detail:
          type: string
        last_success_at:
          type: string
          format: date-time
          nullable: true
        last_reconciled_at:
          type: string
          format: date-time
          nullable: true
        repository:
          type: string
        visibility:
          type: string
        version:
          type: integer
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Channel'
        operations:
          $ref: '#/components/schemas/OperationCounts'
      required:
      - channels
      - error_code
      - error_detail
      - external_id
      - identity
      - last_reconciled_at
      - last_success_at
      - operations
      - provider
      - repository
      - scopes
      - status
      - version
      - visibility
    ConnectionStatusEnum:
      enum:
      - active
      - error
      - disconnected
      type: string
      description: |-
        * `active` - Active
        * `error` - Needs attention
        * `disconnected` - Disconnected
    CreateProblemForReport:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 10000
        owner_id:
          type: string
          format: uuid
          nullable: true
      required:
      - expected_version
      - title
    Delete:
      type: object
      properties:
        confirmation:
          type: string
      required:
      - confirmation
    DeleteReport:
      type: object
      properties:
        confirmation:
          type: string
        version:
          type: integer
          minimum: 1
      required:
      - confirmation
      - version
    Disconnect:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        confirmation:
          $ref: '#/components/schemas/ConfirmationEnum'
      required:
      - confirmation
      - version
    EngineeringIssue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
        url:
          type: string
        title:
          type: string
        state:
          $ref: '#/components/schemas/EngineeringIssueStateEnum'
        state_reason:
          type: string
        access:
          $ref: '#/components/schemas/AccessEnum'
        repository:
          type: string
        provider_updated_at:
          type: string
          format: date-time
        last_synced_at:
          type: string
          format: date-time
          nullable: true
        last_attempted_sync_at:
          type: string
          format: date-time
          nullable: true
        refresh_status:
          type: string
          readOnly: true
        access_reason:
          type: string
          readOnly: true
        access_detail:
          type: string
          readOnly: true
        sync_error:
          type: string
        stale:
          type: boolean
          readOnly: true
        stale_after:
          readOnly: true
      required:
      - access
      - access_detail
      - access_reason
      - id
      - last_attempted_sync_at
      - last_synced_at
      - number
      - provider_updated_at
      - refresh_status
      - repository
      - stale
      - stale_after
      - state
      - state_reason
      - sync_error
      - title
      - url
    EngineeringIssueStateEnum:
      enum:
      - open
      - closed
      type: string
      description: |-
        * `open` - Open
        * `closed` - Closed
    Error:
      type: object
      properties:
        detail:
          type: string
        reason:
          type: string
        field_errors:
          type: object
          additionalProperties: {}
      required:
      - detail
      - reason
    ExternalOperation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/ExternalOperationStateEnum'
        destination:
          type: string
        remote_issue_id:
          type: string
        remote_number:
          type: integer
          nullable: true
        remote_url:
          type: string
        safe_error:
          type: string
        recovery_requested:
          type: boolean
        error_detail:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
        approved_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - approved_at
      - completed_at
      - created_at
      - destination
      - error_detail
      - id
      - recovery_requested
      - remote_issue_id
      - remote_number
      - remote_url
      - safe_error
      - state
    ExternalOperationStateEnum:
      enum:
      - draft
      - queued
      - running
      - succeeded
      - failed
      - uncertain
      - cancelled
      type: string
      description: |-
        * `draft` - Draft
        * `queued` - Queued
        * `running` - Running
        * `succeeded` - Succeeded
        * `failed` - Failed
        * `uncertain` - Uncertain
        * `cancelled` - Cancelled
    FixApplicability:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        expected_resolution_revision:
          type: integer
          minimum: 1
      required:
      - expected_resolution_revision
      - expected_version
    FixConfirmation:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        fix_note:
          type: string
          maxLength: 10000
        fix_version:
          type: string
          maxLength: 100
        evidence_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
      required:
      - expected_version
      - fix_note
      - fix_version
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
      required:
      - status
    HealthStatusEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    InvitationAccept:
