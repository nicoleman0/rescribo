<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rescribo</title>
    <script id="theme-boot">
      // Sets the theme and palette before first paint. Mirrors readPreference, resolveTheme,
      // and readPalette in src/lib/theme.ts. Keep the keys and the palette list in step with it.
      ;(function () {
        var theme = null
        var palette = null
        try {
          theme = localStorage.getItem('rescribo-theme')
          palette = localStorage.getItem('rescribo-palette')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.dataset.palette =
          ['forest', 'autumn', 'sky'].indexOf(palette) >= 0 ? palette : 'indigo'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
