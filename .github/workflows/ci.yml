name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          python-version: "3.14"
      - uses: arduino/setup-task@v2
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: task install services migrate
      - run: task check test build schema-check
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: task e2e
      - name: Worker smoke check
        run: |
          setsid task worker > /tmp/feedback-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill -TERM -"$worker_pid" 2>/dev/null || true' EXIT
          task worker-check
      - name: Stop local services
        if: always()
        run: docker compose down
