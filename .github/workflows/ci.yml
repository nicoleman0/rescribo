name: Checks
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR makes the older run obsolete.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Switchyard's checks on the workflow's own files.
  workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Lint shell scripts
        run: git ls-files -z '.claude/skills/work-issues/*.sh' | xargs -0 shellcheck
      - name: Compile Python scripts
        run: git ls-files -z '.claude/skills/work-issues/*.py' | xargs -0 python3 -m py_compile
      - name: Check JavaScript syntax
        run: git ls-files -z '.claude/skills/work-issues/*.mjs' | xargs -0 -n 1 node --check
      - name: Test the scripts
        run: python3 -m unittest discover -s .claude/skills/work-issues/scripts -p 'test_*.py'
      - name: Validate OpenSpec
        run: npx --yes @fission-ai/openspec validate --all --strict

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          python-version: "3.14"
      - uses: arduino/setup-task@v2
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task bootstrap
      - run: uv sync --locked
      # Anonymous Docker Hub pulls are rate limited on shared runners.
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: task services migrate
      - run: task check-backend test-backend schema-check-backend
      - name: Stop local services
        if: always()
        run: docker compose down

  # rustup installs the toolchain pinned in rust/rust-toolchain.toml on first use.
  matcher:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task check-matcher test-matcher

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: task check-frontend test-frontend build schema-check-frontend

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          python-version: "3.14"
      - uses: arduino/setup-task@v2
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: task install services migrate
      - run: ../scripts/ci_playwright_install.sh
        working-directory: frontend
      - run: task e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local services
        if: always()
        run: docker compose down

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          python-version: "3.14"
      - uses: arduino/setup-task@v2
        with:
          version: "3.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task bootstrap
      - run: uv sync --locked
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: task services migrate
      - run: task matcher-build
      - name: Worker smoke check
        run: |
          setsid task worker > /tmp/feedback-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill -TERM -"$worker_pid" 2>/dev/null || true' EXIT
          task worker-check
          task github-product-worker-check
      - name: Show worker log
        if: failure()
        run: cat /tmp/feedback-worker.log
      - name: Stop local services
        if: always()
        run: docker compose down
