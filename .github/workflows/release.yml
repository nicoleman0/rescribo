name: Release images

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'backend/Dockerfile'
      - 'proxy/Dockerfile'

permissions:
  contents: read

jobs:
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check release version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path
          from packaging.version import InvalidVersion, Version

          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+(?:-rc\.\d+)?)", tag)
          if match is None:
              raise SystemExit(f"Invalid release tag: {tag}")
          tag_version = match.group(1)
          with Path("pyproject.toml").open("rb") as file:
              project_version = tomllib.load(file)["project"]["version"]
          try:
              matches_project = Version(tag_version) == Version(project_version)
          except InvalidVersion as error:
              raise SystemExit(f"Invalid project or tag version: {error}")
          if not matches_project:
              raise SystemExit(
                  f"Tag version {tag_version} does not match pyproject.toml {project_version}"
              )
          compose = Path("compose.prod.yaml").read_text()
          for image in ("rescribo-backend", "rescribo-proxy"):
              expected = f"ghcr.io/nicoleman0/{image}:{tag_version}"
              if not re.search(rf"^\s*image:\s*{re.escape(expected)}\s*$", compose, re.M):
                  raise SystemExit(f"compose.prod.yaml must reference {expected}")
          print(f"Release version {tag_version} matches project and compose")
          PY

  build:
    needs: version
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            repository: rescribo-backend
            dockerfile: backend/Dockerfile
            target: production
            runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - image: backend
            repository: rescribo-backend
            dockerfile: backend/Dockerfile
            target: production
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
          - image: proxy
            repository: rescribo-proxy
            dockerfile: proxy/Dockerfile
            target: ''
            runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - image: proxy
            repository: rescribo-proxy
            dockerfile: proxy/Dockerfile
            target: ''
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nicoleman0/${{ matrix.repository }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/nicoleman0/${{ matrix.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }},mode=max
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: backend
            repository: rescribo-backend
          - image: proxy
            repository: rescribo-proxy
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nicoleman0/${{ matrix.repository }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
      - name: Create multi-platform manifest
        env:
          IMAGE: ghcr.io/nicoleman0/${{ matrix.repository }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          digests=$(find "$RUNNER_TEMP/digests" -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$(printf '%s\n' "$digests" | wc -l)" -eq 2
          for tag in $TAGS; do
            refs=
            for digest in $digests; do refs="$refs $IMAGE@sha256:$digest"; done
            docker buildx imagetools create $(printf -- '-t %s ' "$tag") $refs
          done

  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: production
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: proxy/Dockerfile
