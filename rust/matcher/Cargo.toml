[package]
name = "matcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-or-later"
publish = false

# JSON is the contract; serde_json is the standard parser and has no network or I/O features.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
